<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Gestor - Debug</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
    .btn { padding: 10px 20px; margin: 5px; background: #3b82f6; border: none; color: #fff; cursor: pointer; border-radius: 6px; }
    .btn:hover { background: #2563eb; }
    .log { background: #0f1117; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px; max-height: 400px; overflow: auto; }
    .log-entry { margin: 3px 0; padding: 3px 0; border-bottom: 1px solid #333; }
    .error { color: #ef4444; }
    .success { color: #22c55e; }
    .warn { color: #f59e0b; }
    h2 { color: #3b82f6; }
  </style>
</head>
<body>
  <h1>Teste de Debug - Gestor</h1>
  
  <h2>1. Verificar Sessao</h2>
  <button class="btn" onclick="checkSession()">Verificar sys_session</button>
  <button class="btn" onclick="createTestSession()">Criar Sessao de Teste</button>
  
  <h2>2. Testar API Client</h2>
  <button class="btn" onclick="testApiClient()">Testar window.AppAPI</button>
  
  <h2>3. Testar Funcoes</h2>
  <button class="btn" onclick="testFunctions()">Verificar Funcoes Globais</button>
  
  <h2>4. Testar Modais</h2>
  <button class="btn" onclick="testOpenModal()">Testar openModal</button>
  
  <h2>Log de Debug</h2>
  <div class="log" id="log"></div>

  <script>
    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
      logEl.insertBefore(entry, logEl.firstChild);
      console.log('[TEST]', msg);
    }

    function checkSession() {
      const raw = sessionStorage.getItem('sys_session');
      if (!raw) {
        log('sys_session NAO existe no sessionStorage', 'error');
        return;
      }
      try {
        const sess = JSON.parse(raw);
        log('sys_session encontrada:', 'success');
        log('  - tenant_id: ' + (sess.tenant_id || 'NAO DEFINIDO'), sess.tenant_id ? 'success' : 'error');
        log('  - nome: ' + (sess.nome || 'N/A'));
        log('  - role: ' + (sess.role || 'N/A'));
        log('  - email: ' + (sess.email || 'N/A'));
        log('  - ts: ' + new Date(sess.ts).toLocaleString());
      } catch(e) {
        log('Erro ao parsear sys_session: ' + e.message, 'error');
      }
    }

    function createTestSession() {
      const testSession = {
        id: 1,
        nome: 'Teste Usuario',
        email: 'teste@exemplo.com',
        role: 'gestor',
        ativo: true,
        tenant_id: 'TENANT_TESTE_123',
        ts: Date.now()
      };
      sessionStorage.setItem('sys_session', JSON.stringify(testSession));
      log('Sessao de teste criada com tenant_id: TENANT_TESTE_123', 'success');
      log('Agora recarregue a pagina do gestor para testar', 'warn');
    }

    function testApiClient() {
      if (typeof window.AppAPI === 'undefined') {
        log('window.AppAPI NAO existe - api-client.js nao carregou!', 'error');
        return;
      }
      log('window.AppAPI existe', 'success');
      
      if (typeof window.AppAPI.from === 'function') {
        log('  - .from() existe', 'success');
      } else {
        log('  - .from() NAO existe', 'error');
      }
    }

    function testFunctions() {
      const funcs = ['openModal', 'closeModal', 'openAddItemModal', 'addCategory', 'addItem', 'saveEditItem'];
      funcs.forEach(fn => {
        if (typeof window[fn] === 'function') {
          log(fn + '() existe', 'success');
        } else {
          log(fn + '() NAO existe - gestor.js nao carregou corretamente', 'error');
        }
      });
    }

    function testOpenModal() {
      if (typeof openModal !== 'function') {
        log('openModal nao existe!', 'error');
        return;
      }
      
      // Criar modal de teste
      const modal = document.createElement('div');
      modal.id = 'modal-teste';
      modal.className = 'modal-bg';
      modal.innerHTML = '<div style="background:#fff;color:#000;padding:20px;border-radius:8px;max-width:300px;margin:100px auto;">Modal de teste funcionando! Clique fora para fechar.</div>';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;';
      modal.onclick = e => { if(e.target === modal) modal.remove(); };
      document.body.appendChild(modal);
      
      try {
        openModal('modal-teste');
        modal.style.display = 'flex';
        log('openModal() chamado com sucesso', 'success');
      } catch(e) {
        log('Erro ao chamar openModal: ' + e.message, 'error');
      }
    }

    // Auto-run checks
    window.onload = function() {
      log('=== Iniciando verificacoes automaticas ===');
      checkSession();
      testApiClient();
    };
  </script>

  <!-- Carregar api-client.js para teste -->
  <script src="/api-client.js"></script>
</body>
</html>
