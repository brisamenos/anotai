<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — Estima Food</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafbfc;
  --card:#ffffff;
  --border:#e5e7eb;
  --border-strong:#d1d5db;
  --accent:#3b82f6;
  --accent-2:#2563eb;
  --accent-soft:#eff6ff;
  --danger:#dc2626;
  --warn:#ea580c;
  --success:#16a34a;
  --text:#111827;
  --text-2:#374151;
  --text-3:#6b7280;
  --muted:#9ca3af;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
/* Background sutil com gradiente colorido bem suave */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(59,130,246,.08), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 100%, rgba(168,85,247,.05), transparent 70%),
    radial-gradient(ellipse 50% 40% at 0% 80%, rgba(34,197,94,.04), transparent 70%);
  pointer-events:none;
  z-index:0;
}
/* Padrão de grid sutilíssimo */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.015) 1px, transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
}

.card{
  position:relative;
  z-index:1;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px 32px 28px;
  width:420px;
  max-width:100%;
  box-shadow:
    0 1px 0 rgba(255,255,255,.8) inset,
    0 1px 2px rgba(0,0,0,.04),
    0 8px 24px -4px rgba(15,23,42,.08),
    0 24px 48px -16px rgba(15,23,42,.12);
  animation:fadeUp .5s cubic-bezier(.16,1,.3,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Logo grande centralizada */
.brand{display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.brand-logo{
  width:180px;
  height:180px;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 12px 28px rgba(15,23,42,.15));
  animation:logoIn .6s cubic-bezier(.16,1,.3,1);
}
@keyframes logoIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

.title{font-family:'Inter',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.5px;color:var(--text);margin-bottom:4px;text-align:center}
.subtitle{font-size:13px;color:var(--text-3);margin-bottom:24px;font-weight:400;text-align:center}

.field{margin-bottom:14px}
label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--text-2);
  margin-bottom:7px;
  letter-spacing:.1px;
}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .icon-l{
  position:absolute;
  left:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  pointer-events:none;
  transition:color .18s;
}
.input-wrap .icon-r{
  position:absolute;
  right:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-3);
  background:transparent;
  border:0;
  cursor:pointer;
  padding:6px;
  border-radius:6px;
  transition:all .15s;
}
.input-wrap .icon-r:hover{color:var(--text);background:rgba(0,0,0,.04)}
.input-wrap input{
  width:100%;
  background:#fff;
  border:1px solid var(--border-strong);
  border-radius:10px;
  padding:11px 14px 11px 40px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  outline:none;
  transition:all .18s;
  font-weight:500;
}
.input-wrap.has-toggle input{padding-right:42px}
.input-wrap input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(59,130,246,.12);
}
.input-wrap:focus-within .icon-l{color:var(--accent)}
.input-wrap input::placeholder{color:var(--muted);font-weight:400}

.btn{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:0;
  cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:.2px;
  transition:all .2s;
  box-shadow:
    0 1px 0 rgba(255,255,255,.2) inset,
    0 4px 12px -2px rgba(59,130,246,.4),
    0 1px 2px rgba(0,0,0,.06);
  margin-top:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.2) inset,
    0 8px 20px -4px rgba(59,130,246,.5),
    0 1px 2px rgba(0,0,0,.06);
}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.btn .arrow{transition:transform .2s}
.btn:hover:not(:disabled) .arrow{transform:translateX(2px)}

.alert{
  display:none;
  align-items:flex-start;
  gap:10px;
  border-radius:9px;
  padding:11px 13px;
  font-size:12.5px;
  margin-bottom:14px;
  line-height:1.45;
  font-weight:500;
}
.alert.on{display:flex}
.alert svg{flex-shrink:0;margin-top:1px}
.alert-err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}

.spinner{
  display:inline-block;
  width:14px;height:14px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid var(--border);
  text-align:center;
}
.download-btn{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:10px 18px;
  background:#fff;
  border:1px solid var(--border-strong);
  border-radius:9px;
  color:var(--text-2);
  text-decoration:none;
  font-size:12.5px;
  font-weight:500;
  transition:all .2s;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.download-btn:hover{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-2);
}
.download-btn svg{color:var(--accent)}
.footer-note{
  font-size:10.5px;
  color:var(--muted);
  margin-top:8px;
  letter-spacing:.1px;
}

/* Esconde classes antigas pra evitar resíduo visual */
.divider,.link-admin,.err{display:none}
</style>
<script src="/api-client.js"></script>
</head>
<body>
<div class="card">

  <div class="brand">
    <img src="https://i.ibb.co/TxxdXcKk/IMG-8056-1.png" alt="Estima Food" class="brand-logo">
  </div>

  <h1 class="title">Bem-vindo</h1>
  <p class="subtitle">Acesse o painel do seu estabelecimento</p>

  <div class="alert alert-err" id="lg-err">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span id="lg-err-text"></span>
  </div>
  <div class="alert alert-warn" id="lg-expiry">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3l9.5 17H2.5L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10v4M12 17v.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span id="lg-expiry-text"></span>
  </div>

  <div class="field">
    <label for="lg-email">Email</label>
    <div class="input-wrap">
      <span class="icon-l" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 7l8.5 6 8.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <input id="lg-email" type="email" placeholder="seu@email.com" autocomplete="email" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
  </div>

  <div class="field">
    <label for="lg-senha">Senha</label>
    <div class="input-wrap has-toggle">
      <span class="icon-l" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="11" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <input id="lg-senha" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="icon-r" type="button" id="toggle-senha" aria-label="Mostrar senha" onclick="togglePwd()">
        <svg id="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        <svg id="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M3 3l18 18M10.5 6.2A8.6 8.6 0 0 1 12 6c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3 3.7M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.9-.8M9.5 9.5a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <button class="btn" id="btn-login" onclick="doLogin()">
    <span id="btn-label">Entrar</span>
    <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" id="btn-arrow"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="footer">
    <a href="/download" class="download-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Aplicativo Desktop para Windows</span>
    </a>
    <div class="footer-note">Impressão automática · Acesso rápido · Sem navegador</div>
  </div>
</div>

<script>
const sb = window.AppAPI;

(function(){
  try {
    // Restaura a sessão da localStorage (sobrevive a fechar o navegador)
    // pra sessionStorage, igual o gestor.html já faz — sem isso, essa
    // checagem abaixo nunca via a sessão depois de reabrir o navegador.
    if (!sessionStorage.getItem('sys_session')) {
      const saved = localStorage.getItem('_persist_sys_session');
      if (saved) sessionStorage.setItem('sys_session', saved);
    }
    const s = JSON.parse(sessionStorage.getItem('sys_session') || 'null');
    // 30 dias, igual o resto do sistema — sessão "continua logada" de verdade
    if (s && s.tenant_id && Date.now() - s.ts < 30*24*60*60*1000) {
      window.location.href = s.billing_locked ? 'gestor.html?billing=1' : 'gestor.html';
    }
  } catch(e) {}
})();

function togglePwd() {
  const inp = document.getElementById('lg-senha');
  const show = document.getElementById('eye-show');
  const hide = document.getElementById('eye-hide');
  const btn  = document.getElementById('toggle-senha');
  if (inp.type === 'password') {
    inp.type = 'text';
    show.style.display = 'none';
    hide.style.display = 'block';
    btn.setAttribute('aria-label', 'Ocultar senha');
  } else {
    inp.type = 'password';
    show.style.display = 'block';
    hide.style.display = 'none';
    btn.setAttribute('aria-label', 'Mostrar senha');
  }
}

function showErr(msg) {
  document.getElementById('lg-err-text').textContent = msg;
  document.getElementById('lg-err').classList.add('on');
}
function hideErr() {
  document.getElementById('lg-err').classList.remove('on');
}
function showWarn(msg) {
  document.getElementById('lg-expiry-text').textContent = msg;
  document.getElementById('lg-expiry').classList.add('on');
}
function hideWarn() {
  document.getElementById('lg-expiry').classList.remove('on');
}

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function doLogin() {
  const email = document.getElementById('lg-email').value.trim().toLowerCase();
  const senha = document.getElementById('lg-senha').value;
  const btn   = document.getElementById('btn-login');
  const lbl   = document.getElementById('btn-label');
  const arr   = document.getElementById('btn-arrow');

  hideErr();
  hideWarn();

  if (!email || !senha) {
    showErr('Preencha email e senha.');
    return;
  }

  btn.disabled = true;
  lbl.innerHTML = '<span class="spinner"></span> Entrando...';
  if (arr) arr.style.display = 'none';

  const restoreBtn = () => {
    btn.disabled = false;
    lbl.textContent = 'Entrar';
    if (arr) arr.style.display = '';
  };

  try {
    const hash = await sha256(senha);

    const { data: u, error } = await sb
      .from('sys_users')
      .select('id,nome,email,role,ativo,tenant_id,tenants(nome,ativo,expires_at,plano)')
      .eq('email', email)
      .eq('senha_hash', hash)
      .single();

    if (error || !u) {
      showErr('Email ou senha incorretos.');
      restoreBtn();
      return;
    }

    if (!u.ativo) {
      showErr('Sua conta está desativada. Fale com o administrador.');
      restoreBtn();
      return;
    }

    const tenant = u.tenants;
    let billingLocked = false;
    let billingExpiredAt = null;

    if (tenant && !tenant.ativo) {
      showErr('Acesso suspenso. Entre em contato com o suporte.');
      restoreBtn();
      return;
    }

    if (tenant?.expires_at) {
      const exp     = new Date(tenant.expires_at);
      const agora   = new Date();
      const diffDias= Math.ceil((exp - agora) / (1000*60*60*24));
      if (diffDias < 0) {
        billingLocked = true;
        billingExpiredAt = tenant.expires_at;
        showWarn(`Mensalidade vencida em ${exp.toLocaleDateString('pt-BR')}. Voce entrara apenas para renovar o plano.`);
      }
      if (!billingLocked && diffDias <= 7) {
        showWarn(`Seu acesso expira em ${diffDias} dia(s) (${exp.toLocaleDateString('pt-BR')}). Renove com o administrador.`);
      }
    }

    sessionStorage.setItem('sys_session', JSON.stringify({
      id:        u.id,
      nome:      u.nome,
      email:     u.email,
      role:      u.role,
      tenant_id: u.tenant_id,
      plano:     tenant?.plano || 'pro',
      tenant_ativo: tenant?.ativo !== false,
      tenant_expires_at: tenant?.expires_at || null,
      billing_locked: billingLocked,
      billing_reason: billingLocked ? 'expired' : null,
      billing_expired_at: billingExpiredAt,
      ts:        Date.now()
    }));

    await sb.from('sys_users').update({ ultimo_acesso: new Date().toISOString() }).eq('id', u.id);

    window.location.href = billingLocked ? 'gestor.html?billing=1' : 'gestor.html';

  } catch(e) {
    showErr('Erro de conexão. Tente novamente.');
    restoreBtn();
  }
}
</script>
</body>
</html>
