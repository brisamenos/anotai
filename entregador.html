<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entregador">
  <link rel="manifest" href="/manifest-entregador.json">
  <link rel="icon" type="image/png" href="/favicon-entregador.png">
  <link rel="apple-touch-icon" href="/favicon-entregador.png">
  <title>Entregador</title>
  <style>
    :root{
      --bg:#f4f7fb;--bg2:#e9f0f7;--surface:#fff;--surface2:#eef3f8;--ink:#0f172a;
      --text:#172033;--muted:#6b7788;--line:#d9e3ee;--navy:#101820;--navy2:#172234;
      --accent:#10b981;--accent2:#0ea5e9;--warn:#f59e0b;--danger:#ef4444;--white:#fff;
      --shadow:0 18px 48px rgba(15,23,42,.14);--shadow2:0 10px 24px rgba(15,23,42,.10);
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0;
      background:
        linear-gradient(115deg,rgba(16,185,129,.08) 0 1px,transparent 1px 90px),
        linear-gradient(180deg,#edf3f9 0%,#f8fafc 38%,#eef4f8 100%);
      min-height:100dvh;
    }
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100dvh;padding:12px 14px 102px;max-width:820px;margin:0 auto}
    .top{
      position:sticky;top:0;z-index:10;margin:0 -14px 12px;padding:10px 14px 14px;
      background:linear-gradient(180deg,rgba(244,247,251,.98) 78%,rgba(244,247,251,0));
      backdrop-filter:blur(18px);
    }
    .hero{
      position:relative;overflow:hidden;color:var(--white);border:1px solid rgba(255,255,255,.08);border-radius:8px;
      background:
        linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 42px),
        linear-gradient(135deg,var(--navy) 0%,#16263a 52%,#0b3b33 100%);
      box-shadow:var(--shadow);
    }
    .hero::after{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
      background:repeating-linear-gradient(135deg,transparent 0 16px,rgba(255,255,255,.34) 16px 17px,transparent 17px 34px);
      mask-image:linear-gradient(90deg,transparent,black 30%,black 88%,transparent);
    }
    .hero-inner{position:relative;z-index:1;padding:16px}
    .bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .brand{min-width:0;display:flex;align-items:center;gap:12px}
    .avatar{
      width:46px;height:46px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
      background:linear-gradient(135deg,#34d399,#0ea5e9);color:#042f2e;font-weight:950;
      box-shadow:0 14px 30px rgba(16,185,129,.22),inset 0 1px rgba(255,255,255,.55);
    }
    .brand-copy{min-width:0}
    .eyebrow{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.64);margin-bottom:4px}
    .brand h1{font-size:22px;margin:0;font-weight:920;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand p{font-size:12px;margin:5px 0 0;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hero-tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
    .stat{
      min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px;
      background:rgba(255,255,255,.08);box-shadow:inset 0 1px rgba(255,255,255,.08);
    }
    .stat span{display:block;font-size:10px;color:rgba(255,255,255,.62);font-weight:800;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stat strong{display:block;margin-top:5px;font-size:17px;line-height:1;font-weight:920;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .btn{
      border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:10px 12px;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:850;font-size:13px;min-height:44px;
      text-decoration:none;box-shadow:0 1px 0 rgba(255,255,255,.7),0 8px 18px rgba(15,23,42,.06);
      transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}
    .btn:active{transform:translateY(0) scale(.99)}
    .btn svg{width:16px;height:16px;flex:0 0 auto;stroke-width:2.2}
    .btn.primary{background:linear-gradient(180deg,#34d399,#10b981);border-color:#10b981;color:#052e25;box-shadow:0 14px 26px rgba(16,185,129,.24)}
    .btn.info{background:linear-gradient(180deg,#38bdf8,#0ea5e9);border-color:#0ea5e9;color:#06283d;box-shadow:0 14px 26px rgba(14,165,233,.22)}
    .btn.warn{background:linear-gradient(180deg,#fbbf24,#f59e0b);border-color:#f59e0b;color:#3b2103}
    .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
    .btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;box-shadow:none}
    .btn.subtle{background:#f8fafc}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .install-inline{width:100%;margin-top:10px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .card{
      position:relative;overflow:hidden;background:rgba(255,255,255,.96);border:1px solid rgba(217,227,238,.92);
      border-radius:8px;padding:14px;margin:12px 0;box-shadow:var(--shadow2);
      transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
    }
    .card:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:#c8d7e6}
    .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .card.status-problema::before{background:linear-gradient(90deg,var(--warn),var(--danger))}
    .card.status-atribuida::before{background:linear-gradient(90deg,var(--warn),#f97316)}
    .card.status-entregue::before{background:linear-gradient(90deg,#10b981,#22c55e)}
    .login{min-height:100dvh;display:grid;place-items:center;padding:18px}
    .login-shell{width:min(940px,100%);display:grid;grid-template-columns:1.04fr .96fr;gap:14px;align-items:stretch}
    .login-brand,.login-card{border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
    .login-brand{
      color:#fff;padding:24px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between;
      background:
        linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 44px),
        linear-gradient(135deg,var(--navy),#182a42 58%,#0c3f36);
    }
    .login-brand h1{font-size:34px;line-height:1;margin:8px 0 10px;font-weight:950}
    .login-brand p{margin:0;color:rgba(255,255,255,.72);font-size:14px;line-height:1.5;max-width:390px}
    .login-card{width:100%;background:var(--surface);border:1px solid var(--line);padding:22px;align-self:center}
    .login-card h1{font-size:24px;margin:0 0 5px;color:var(--ink)}
    .login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
    .login-mark{width:58px;height:58px;border-radius:8px;display:grid;place-items:center;background:#d1fae5;color:#065f46;margin-bottom:16px}
    .login-mark svg{width:29px;height:29px}
    .login-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:24px}
    .login-chip{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);border-radius:8px;padding:10px;font-size:12px;color:rgba(255,255,255,.76);font-weight:800}
    label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:12px 0 6px}
    input,textarea{
      width:100%;background:#f8fafc;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:13px 12px;outline:none;
      box-shadow:inset 0 1px 2px rgba(15,23,42,.04);
    }
    textarea{min-height:88px;resize:vertical}
    input:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(14,165,233,.12)}
    .pill{
      display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f8fafc;border-radius:999px;
      padding:6px 10px;font-size:11px;font-weight:850;color:var(--muted);white-space:nowrap;line-height:1;
    }
    .pill svg{width:13px;height:13px;stroke-width:2.4}
    .pill.ok{color:#047857;border-color:rgba(16,185,129,.32);background:#ecfdf5}
    .pill.warn{color:#9a5b00;border-color:rgba(245,158,11,.34);background:#fffbeb}
    .pill.info{color:#0369a1;border-color:rgba(14,165,233,.28);background:#eff6ff}
    .pill.danger{color:#b91c1c;border-color:rgba(239,68,68,.28);background:#fef2f2}
    .section-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 8px}
    .section-title{font-size:12px;text-transform:uppercase;color:#526071;font-weight:950;letter-spacing:.08em;margin:0}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
    .tab-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;min-height:42px;padding:9px 10px;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
    .tab-btn.on{background:#101820;color:#fff;border-color:#101820}
    .tab-btn svg{width:15px;height:15px}
    .route-panel{border:1px solid var(--line);background:rgba(255,255,255,.78);border-radius:8px;padding:12px;margin:10px 0 12px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
    .route-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .route-panel-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:950;color:#526071}
    .sequence-list{display:grid;gap:7px}
    .sequence-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid #e3ebf3;background:#fbfdff;border-radius:8px;padding:8px}
    .sequence-num{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#e0f2fe;color:#075985;font-size:12px;font-weight:950}
    .sequence-main{min-width:0}
    .sequence-main strong{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sequence-main span{display:block;margin-top:2px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sequence-actions{display:flex;gap:5px}
    .icon-btn{width:33px;height:33px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#263244;display:grid;place-items:center}
    .icon-btn:disabled{opacity:.4}
    .icon-btn svg{width:15px;height:15px}
    .available-card{border:1px solid rgba(217,227,238,.92);background:#fff;border-radius:8px;padding:12px;margin:10px 0;box-shadow:var(--shadow2)}
    .available-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .available-check{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin-top:2px}
    .available-main{min-width:0;flex:1}
    .available-title{font-size:16px;font-weight:950;color:var(--ink);margin-bottom:3px}
    .available-client{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .available-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .order-kicker{display:flex;align-items:center;gap:8px;margin-bottom:5px}
    .order-title{font-size:22px;font-weight:950;margin:0;color:var(--ink);line-height:1}
    .client{font-size:13px;color:var(--muted);line-height:1.4;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .client strong{color:var(--text);font-weight:880}
    .addr{
      position:relative;margin-top:13px;padding:12px 12px 12px 38px;font-size:13px;line-height:1.45;color:#263244;
      border-top:1px solid var(--line);border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#fbfdff,#f4f8fb);
    }
    .addr svg{position:absolute;left:13px;top:13px;width:16px;height:16px;color:var(--accent2)}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
    .meta-box{min-width:0;border:1px solid var(--line);border-radius:8px;background:#fbfdff;padding:9px}
    .meta-box span{display:block;font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta-box strong{display:block;margin-top:5px;font-size:14px;color:var(--ink);font-weight:920;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta-box.warn strong{color:#92400e}
    .meta-box.ok strong{color:#047857}
    .items{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:#667386;line-height:1.55}
    .items-title{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:950;color:#8894a5;margin-bottom:6px}
    .map{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#e7eef6;height:168px;box-shadow:inset 0 1px rgba(255,255,255,.8)}
    .map iframe{width:100%;height:100%;border:0;display:block}
    .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
    .wide{grid-column:1/-1}
    .route-steps{display:flex;align-items:center;gap:8px;margin-top:12px;color:#718096;font-size:11px;font-weight:850}
    .route-steps span{display:flex;align-items:center;gap:6px;white-space:nowrap}
    .route-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;box-shadow:0 0 0 3px #f1f5f9}
    .route-steps .on .route-dot{background:var(--accent);box-shadow:0 0 0 4px rgba(16,185,129,.14)}
    .route-line{height:1px;flex:1;background:linear-gradient(90deg,#cbd5e1,#94a3b8)}
    .problem-note{margin-top:12px;border:1px solid rgba(239,68,68,.2);background:#fff1f2;color:#9f1239;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45}
    .empty{border:1px dashed #c7d5e5;border-radius:8px;padding:24px;text-align:center;color:var(--muted);font-size:13px;background:rgba(255,255,255,.68)}
    .empty svg{width:28px;height:28px;color:#94a3b8;margin-bottom:8px}
    .toast{position:fixed;left:14px;right:14px;bottom:18px;background:#111827;border:1px solid rgba(255,255,255,.12);color:#fff;padding:13px 14px;border-radius:8px;box-shadow:0 18px 44px rgba(15,23,42,.35);font-size:13px;z-index:30;display:none}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);border-top:1px solid rgba(217,227,238,.9);backdrop-filter:blur(16px);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:20}
    .bottom-inner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media (max-width:720px){.login-shell{grid-template-columns:1fr}.login-brand{min-height:260px}.login-brand h1{font-size:30px}}
    @media (max-width:520px){
      .app{padding-left:10px;padding-right:10px}.top{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
      .bar{align-items:flex-start}.hero-inner{padding:13px}.avatar{width:42px;height:42px}.brand h1{font-size:19px}
      .hero-tools .btn span{display:none}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:8px}.stat strong{font-size:15px}
      .actions{grid-template-columns:1fr}.available-actions{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.btn{font-size:12px;padding:9px 10px}.map{height:142px}
      .login{padding:12px}.login-brand{display:none}.login-card{padding:18px}.login-card h1{font-size:22px}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"></div>

  <script>
    const qs = new URLSearchParams(location.search);
    const $ = (sel) => document.querySelector(sel);
    const state = {
      session: loadSession(),
      abertas: [],
      disponiveis: [],
      concluidas: [],
      location: null,
      gpsWatch: null,
      gpsLastSent: 0,
      loading: false,
      view: 'rota',
      selectedDisponiveis: new Set(),
      sse: [],
      installPrompt: null
    };

    function loadSession(){
      try { return JSON.parse(localStorage.getItem('entregador_session_v1') || 'null'); }
      catch { return null; }
    }
    function saveSession(sess){
      state.session = sess;
      if (sess) localStorage.setItem('entregador_session_v1', JSON.stringify(sess));
      else localStorage.removeItem('entregador_session_v1');
    }
    function esc(v){
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function money(v){ return 'R$ ' + (parseFloat(v || 0) || 0).toFixed(2).replace('.', ','); }
    function digits(v){ return String(v || '').replace(/\D/g, ''); }
    function orderNum(o){ return o.order_num || o.order_id || o.id || '-'; }
    function statusLabel(s){
      return ({atribuida:'Atribuida',em_rota:'Em rota',problema:'Problema',entregue:'Entregue',retornada:'Retornada'})[s] || s || '-';
    }
    const icons = {
      route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 18h7a5 5 0 0 0 0-10H9"/><path d="M9 5 6 8l3 3"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/></svg>',
      gps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2"/></svg>',
      refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.4 6.4L4 9"/><path d="M5.5 15A7 7 0 0 0 17.6 17.6L20 15"/></svg>',
      logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg>',
      play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
      map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>',
      pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 21s7-5.1 7-12a7 7 0 1 0-14 0c0 6.9 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
      message:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>',
      phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 11.2 19a19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2.1z"/></svg>',
      copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
      cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/></svg>',
      package:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
      user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',

    function icon(name){ return icons[name] || ''; }
    function initials(name){
      return String(name || 'Entregador').trim().split(/\s+/).slice(0,2).map(p => p[0] || '').join('').toUpperCase() || 'E';
    }
    function firstName(name){
      return String(name || 'Entregador').trim().split(/\s+/)[0] || 'Entregador';
    }
    function statusClass(s){
      return ({atribuida:'warn',em_rota:'ok',problema:'danger',entregue:'ok',retornada:'info'})[s] || 'info';
    }
    function cardStatusClass(s){
      return 'status-' + String(s || 'atribuida').replace(/[^a-z0-9_-]/gi, '');
    }
    function paymentLabel(v){
      const p = String(v || '').toLowerCase();
      if (p.includes('pix')) return 'Pix';
      if (p.includes('dinheiro')) return 'Dinheiro';
      if (p.includes('cartao') || p.includes('credito') || p.includes('debito')) return 'Cartao';
      if (p.includes('online')) return 'Online';
      return v || 'Pagamento';
    }
    function sumOpenReceive(){
      return state.abertas.reduce((acc, o) => acc + (parseFloat(o.valor_receber || 0) || 0), 0);
    }
    function countInRoute(){
      return state.abertas.filter(o => o.status === 'em_rota').length;
    }
    function gpsPillHtml(){
      return `${icon('gps')}<span>${state.location ? 'GPS ativo' : 'GPS aguardando'}</span>`;
    }
    function emptyState(text, iconName = 'package'){
      return `<div class="empty">${icon(iconName)}<div>${text}</div></div>`;
    }
    function routeSteps(o){
      const isRoute = o.status === 'em_rota' || o.status === 'problema' || o.status === 'entregue';
      const isDone = o.status === 'entregue';
      return `
        <div class="route-steps" aria-label="Progresso da entrega">
          <span class="on"><i class="route-dot"></i> Atribuida</span>
          <i class="route-line"></i>
          <span class="${isRoute ? 'on' : ''}"><i class="route-dot"></i> Em rota</span>
          <i class="route-line"></i>
          <span class="${isDone ? 'on' : ''}"><i class="route-dot"></i> Entregue</span>
        </div>`;
    }
    function toast(msg){
      const el = $('#toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.style.display = 'none', 3200);
    }
    async function api(path, opts = {}){
      const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
      if (state.session?.token) headers.Authorization = 'Bearer ' + state.session.token;
      const req = Object.assign({}, opts, { headers });
      if (req.body && typeof req.body !== 'string') req.body = JSON.stringify(req.body);
      const res = await fetch(path, req);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Erro na requisicao');
      return data;
    }
    function mapsSearch(addr){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr || ''); }

    function renderAvailableCard(o){

        <div class="card status-entregue">

            <span class="pill ok">${icon('check')}<span>${statusLabel(o.status)}</span></span>
          </div>
          <div class="addr">${icon('pin')}<strong>Destino</strong><br>${esc(o.addr || 'Endereco nao informado')}</div>

        </div>`;
    }
    function renderDeliveryCard(o){
      const phone = digits(o.phone);
      const canStart = !['em_rota', 'problema'].includes(o.status);
      const receive = parseFloat(o.valor_receber || 0) || 0;
      const statusTone = statusClass(o.status);
      return `
        <div class="card ${cardStatusClass(o.status)}" id="entrega-${o.id}">
          <div class="order-head">

              <div class="order-kicker">
                <div class="order-title">#${esc(orderNum(o))}</div>

                ${phone ? `<span>${esc(o.phone)}</span>` : ''}
              </div>
            </div>
            <span class="pill ${statusTone}">${icon(o.status === 'problema' ? 'alert' : o.status === 'em_rota' ? 'route' : 'package')}<span>${statusLabel(o.status)}</span></span>
          </div>
          ${routeSteps(o)}
          <div class="addr">${icon('pin')}<strong>Destino</strong><br>${esc(o.addr || 'Endereco nao informado')}</div>

          <div class="map"><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${mapEmbed(o.addr)}"></iframe></div>
          <div class="actions">

            <button class="btn info" onclick="openGps('${encodeURIComponent(o.addr || '')}')">${icon('map')}<span>Abrir GPS</span></button>
            <button class="btn subtle" onclick="sendMsg(${o.id}, 'cheguei')">${icon('pin')}<span>Ja cheguei</span></button>
            <button class="btn warn" onclick="notFound(${o.id})">${icon('alert')}<span>Nao achei</span></button>
            <button class="btn subtle" onclick="customMsg(${o.id})">${icon('message')}<span>Mensagem</span></button>
            ${phone ? `<a class="btn subtle" href="tel:${phone}">${icon('phone')}<span>Ligar</span></a>` : `<button class="btn subtle" disabled>${icon('phone')}<span>Ligar</span></button>`}
            <button class="btn subtle" onclick="copyAddress('${encodeURIComponent(o.addr || '')}')">${icon('copy')}<span>Copiar endereco</span></button>
            <button class="btn primary" onclick="deliver(${o.id}, ${receive})">${icon('check')}<span>Entregue</span></button>

    async function login(){
      const tenant = $('#login-tenant')?.value.trim();
      const phone = $('#login-phone')?.value.trim();
      if (!tenant || !phone) return toast('Informe loja e telefone.');
      try {
        const data = await api('/api/entregador-login', { method:'POST', body:{ tenant, telefone: phone } });
        saveSession(data);
        await refresh();
        subscribeRealtime();
        startGps(false);
      } catch(e) { toast(e.message); }
    }
    function logout(){
      if (state.gpsWatch) navigator.geolocation.clearWatch(state.gpsWatch);
      state.gpsWatch = null;
      closeRealtime();
      saveSession(null);
      state.abertas = [];
      state.disponiveis = [];
      state.concluidas = [];
      state.selectedDisponiveis.clear();
      renderLogin();
    }
    function applyDeliveryData(data){
      state.abertas = data.abertas || [];
      state.concluidas = data.concluidas || [];
      state.location = state.location || data.location || null;
      if (Array.isArray(data.disponiveis)) state.disponiveis = data.disponiveis;
      state.selectedDisponiveis = new Set([...state.selectedDisponiveis].filter(id => state.disponiveis.some(o => Number(o.id) === Number(id))));
    }
    async function refresh(silent){
      if (!state.session?.token) return;
      try {
        const entregas = await api('/api/entregador/entregas');
        let disp = { disponiveis: [] };
        try {
          disp = await api('/api/entregador/disponiveis');
        } catch(err) {
          console.warn('[entregador/disponiveis]', err.message);
        }
        applyDeliveryData(Object.assign({}, entregas, { disponiveis: disp.disponiveis || [] }));
        renderApp();
      } catch(e) {
        if (/sessao/i.test(e.message)) logout();
        else if (!silent) toast(e.message);
      }
    }
    function setView(view){
      state.view = view === 'disponiveis' ? 'disponiveis' : 'rota';
      renderApp();
    }
    function toggleAvailable(id, checked){
      id = Number(id);
      if (checked) state.selectedDisponiveis.add(id);
      else state.selectedDisponiveis.delete(id);
      renderApp();
    }
    async function addDelivery(orderId){
      try {
        const data = await api('/api/entregador/adicionar-entregas', { method:'POST', body:{ order_ids:[orderId] } });
        applyDeliveryData(data);
        state.selectedDisponiveis.delete(Number(orderId));
        state.view = 'rota';
        renderApp();
        toast('Entrega adicionada na rota.');
      } catch(e) { toast(e.message); }
    }
    async function addSelectedDeliveries(){
      const ids = [...state.selectedDisponiveis];
      if (!ids.length) return;
      try {
        const data = await api('/api/entregador/adicionar-entregas', { method:'POST', body:{ order_ids:ids } });
        applyDeliveryData(data);
        state.selectedDisponiveis.clear();
        state.view = 'rota';
        renderApp();
        toast('Entregas adicionadas na rota.');
      } catch(e) { toast(e.message); }
    }
    async function moveDelivery(entregaId, direction){
      const idx = state.abertas.findIndex(e => Number(e.id) === Number(entregaId));
      const next = idx + direction;
      if (idx < 0 || next < 0 || next >= state.abertas.length) return;
      const reordered = state.abertas.slice();
      const tmp = reordered[idx];
      reordered[idx] = reordered[next];
      reordered[next] = tmp;
      state.abertas = reordered;
      renderApp();
      try {
        const data = await api('/api/entregador/entregas/ordem', {
          method:'POST',
          body:{ entrega_ids: state.abertas.map(e => e.id) }
        });
        applyDeliveryData(data);
        renderApp();
      } catch(e) {
        toast(e.message);
        refresh(true);
      }
    }
    function scheduleRefresh(){
      clearTimeout(scheduleRefresh._t);
      scheduleRefresh._t = setTimeout(() => refresh(true), 650);
    }
    function closeRealtime(){
      (state.sse || []).forEach(s => { try { s.close(); } catch {} });
      state.sse = [];
    }
    function subscribeRealtime(){
      const tid = state.session?.tenant?.id || state.session?.tenant?.slug || '';
      if (!tid || typeof EventSource === 'undefined' || state.sse.length) return;
      const bind = (source, events) => events.forEach(ev => source.addEventListener(ev, scheduleRefresh));
      const entregas = new EventSource(`/sse/entregas-rt:${encodeURIComponent(tid)}`);
      bind(entregas, ['entregas:INSERT','entregas:UPDATE','entregas:DELETE','rotas_entrega:INSERT','rotas_entrega:UPDATE','entregador_locations:UPDATE']);
      const orders = new EventSource(`/sse/orders-rt:${encodeURIComponent(tid)}`);
      bind(orders, ['orders:INSERT','orders:UPDATE','orders:DELETE']);
      entregas.onerror = orders.onerror = () => {};
      state.sse = [entregas, orders];
    }
    async function installApp(){
      if (state.installPrompt) {
        const promptEvent = state.installPrompt;
        state.installPrompt = null;
        promptEvent.prompt();
        await promptEvent.userChoice.catch(() => null);
        return;
      }
      toast('No Android, toque no menu do navegador e escolha Instalar app.');
    }
    function registerPwa(){
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        state.installPrompt = e;
      });
      navigator.serviceWorker.register('/entregador-sw.js', { scope: '/entregador' }).catch(() => {});
    }
    function startGps(force){
      if (!navigator.geolocation) return toast('GPS nao disponivel neste aparelho.');
      if (state.gpsWatch && force) return toast('GPS ja esta ativo.');
      if (state.gpsWatch) return;
      state.gpsWatch = navigator.geolocation.watchPosition(pos => {
        state.location = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy || 0
        };
        const pill = $('#gps-pill');
        if (pill) { pill.className = 'pill ok'; pill.innerHTML = `${icon('gps')}<span>GPS ativo</span>`; }
        sendLocation(false);
      }, err => {
        const pill = $('#gps-pill');
        if (pill) { pill.className = 'pill warn'; pill.innerHTML = `${icon('gps')}<span>GPS bloqueado</span>`; }
        if (force) toast(err.message || 'Permita o GPS para atualizar sua localizacao.');
      }, { enableHighAccuracy:true, maximumAge:15000, timeout:12000 });
    }
    async function sendLocation(force){
      if (!state.location || !state.session?.token) return;
      const now = Date.now();
      if (!force && now - state.gpsLastSent < 20000) return;
      state.gpsLastSent = now;
      const active = state.abertas.find(e => e.status === 'em_rota') || state.abertas[0] || null;
      try {
        await api('/api/entregador/localizacao', {
          method:'POST',
          body:Object.assign({}, state.location, { entrega_id: active?.id || null })
        });
      } catch(e) {}
    }
    async function setStatus(id, status, extra = {}){
      try {
        await sendLocation(true);
        await api('/api/entregador/status', { method:'POST', body:Object.assign({ entrega_id:id, status }, extra) });
        await refresh();
        toast('Status atualizado.');
      } catch(e) { toast(e.message); }
    }
    async function deliver(id, valorReceber){
      let recebido = valorReceber || 0;
      if (valorReceber > 0) {
        const raw = prompt('Valor recebido (R$)', valorReceber.toFixed(2).replace('.', ','));
        if (raw === null) return;
        recebido = parseFloat(String(raw).replace(',', '.')) || 0;
      }
      await setStatus(id, 'entregue', { recebido });
    }
    async function sendMsg(id, tipo, message){
      try {
        await sendLocation(true);
        const loc = state.location || {};
        const data = await api('/api/entregador/mensagem', {
          method:'POST',
          body:{ entrega_id:id, tipo, message:message || '', lat:loc.lat || null, lng:loc.lng || null }
        });
        toast(data.ok ? 'Mensagem enviada.' : 'Mensagem registrada, mas o envio falhou.');
      } catch(e) { toast(e.message); }
    }
    async function notFound(id){
      await sendMsg(id, 'nao_achei');
      await setStatus(id, 'problema', { problema:'Nao encontrou o endereco' });
    }
    async function customMsg(id){
      const msg = prompt('Mensagem para o cliente');
      if (!msg || !msg.trim()) return;
      await sendMsg(id, 'custom', msg.trim());
    }
    function openGps(encodedAddr){
      window.open(mapsDir(decodeURIComponent(encodedAddr)), '_blank', 'noopener');
    }
    async function copyAddress(encodedAddr){
      const addr = decodeURIComponent(encodedAddr);
      try {
        await navigator.clipboard.writeText(addr);
        toast('Endereco copiado.');
      } catch {
        prompt('Endereco', addr);
      }
    }

    window.login = login;
    window.logout = logout;
    window.refresh = refresh;
    window.setView = setView;
    window.toggleAvailable = toggleAvailable;
    window.addDelivery = addDelivery;
    window.addSelectedDeliveries = addSelectedDeliveries;
    window.moveDelivery = moveDelivery;
    window.installApp = installApp;
    window.startGps = startGps;
    window.setStatus = setStatus;
    window.deliver = deliver;
    window.sendMsg = sendMsg;
    window.notFound = notFound;
    window.customMsg = customMsg;
    window.openGps = openGps;
    window.copyAddress = copyAddress;

    registerPwa();
    render();
    if (state.session?.token) {
      refresh().then(() => { subscribeRealtime(); startGps(false); });
      setInterval(refresh, 30000);
    }
  </script>
</body>
</html>
